<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mở Công Cụ In Đơn Nội Bộ v3 — Thép Siêu Cứng</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      max-width: 520px;
      width: 100%;
      background: #1E293B;
      border: 1.5px solid #F59E0B;
      border-radius: 16px;
      padding: 26px 22px;
      text-align: center;
    }
    h1 { font-size: 19px; font-weight: 800; color: #FDE047; margin-bottom: 8px; }
    p { font-size: 14px; color: #CBD5E1; margin-bottom: 18px; line-height: 1.5; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 15px 18px;
      border-radius: 11px;
      background: linear-gradient(135deg, #EA580C 0%, #D97706 100%);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🖨️ ĐANG CHUYỂN SANG TRANG IN ĐƠN NỘI BỘ...</h1>
    <p>Công cụ in đơn v3 chạy hoàn toàn nội bộ tại mạng nhà/xưởng để bảo mật và in tức thì.</p>
    <a class="btn" href="http://192.168.1.137:5055/">MỞ TRANG IN ĐƠN v3 (http://192.168.1.137:5055/) →</a>
  </div>
  <script>
    (async () => {
      try {
        const c = new AbortController();
        setTimeout(() => c.abort(), 900);
        const r = await fetch('http://127.0.0.1:5055/health', { cache: 'no-store', signal: c.signal });
        if (r.ok) {
          location.replace('http://127.0.0.1:5055/');
          return;
        }
      } catch (e) {}
      location.replace('http://192.168.1.137:5055/');
    })();
  </script>
</body>
</html>
